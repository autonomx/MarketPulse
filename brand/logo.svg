<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="MarketPulse">
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b5802a"/>
      <stop offset="0.5" stop-color="#e2ae49"/>
      <stop offset="1" stop-color="#fbe096"/>
    </linearGradient>
    <linearGradient id="goldCandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d580"/>
      <stop offset="1" stop-color="#c08b2f"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d21"/>
      <stop offset="1" stop-color="#0f0f11"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="200" fill="url(#tile)"/>
  <!-- Candles: wick, then body; each taller than the last. -->
  <g fill="url(#goldCandle)">
    <rect x="227" y="548" width="12" height="214" rx="6"/>
    <rect x="203" y="590" width="60" height="128" rx="9"/>
    <rect x="339" y="452" width="12" height="250" rx="6"/>
    <rect x="315" y="496" width="60" height="158" rx="9"/>
    <rect x="451" y="356" width="12" height="276" rx="6"/>
    <rect x="427" y="400" width="60" height="180" rx="9"/>
    <rect x="563" y="262" width="12" height="292" rx="6"/>
    <rect x="539" y="306" width="60" height="196" rx="9"/>
    <rect x="675" y="176" width="12" height="296" rx="6"/>
    <rect x="651" y="220" width="60" height="206" rx="9"/>
  </g>
  <!-- The rising sweep: one tapered stroke from the lower left, ending in an arrowhead at the upper right. -->
  <path fill="url(#gold)" d="M128 884 C 468 856 704 708 846 360 L 776 336 C 652 668 446 822 128 884 Z"/>
  <path fill="url(#gold)" d="M884 136 L 926 396 L 700 318 Z"/>
</svg>
