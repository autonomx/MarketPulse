# The MarketPulse installers: Windows (roadmap MP-9.1) and macOS (MP-11.2). Run: npm --prefix desktop run dist
appId: com.autonomx.marketpulse
productName: MarketPulse
copyright: Copyright (c) 2026 Autonomx
directories:
  output: release
  buildResources: build-resources
files:
  - out/**
  - package.json
  - "!out/**/*.map"
extraResources:
  # The staged runtime (python, postgres, app, web, licenses), built by build/stage.py.
  - from: ../build/stage
    to: runtime
    filter:
      - "**/*"
      - "!**/__pycache__/**"
  # The publisher's Google OAuth Desktop client, when the build has one.
  - from: config
    to: .
    filter:
      - google-oauth.json
asar: true
compression: normal
win:
  target:
    - target: nsis
      arch: [x64]
  icon: ../brand/out/icon.ico
  executableName: MarketPulse
  # Signing comes from the environment (scripts/dist.mjs, MP-9.2); without it the build is unsigned.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MarketPulse
  deleteAppDataOnUninstall: false
  include: build-resources/installer.nsh
  installerIcon: ../brand/out/icon.ico
  uninstallerIcon: ../brand/out/icon.ico
  license: ../LICENSE
mac:
  # The macOS app (roadmap MP-11.2). dist.mjs builds the architecture of the staged runtime (build-info.json) and
  # turns notarization on when Apple credentials are in the environment.
  target:
    - dmg
    # electron-updater on macOS updates from the zip.
    - zip
  icon: ../brand/out/icon-1024.png
  category: public.app-category.finance
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  notarize: false
  minimumSystemVersion: "12.0"
  extendInfo:
    NSUserNotificationAlertStyle: alert
dmg:
  sign: false
  title: MarketPulse
publish:
  # Releases of autonomx/MarketPulse (MP-9.3). The repository must be public: the updater reads releases without a
  # token, and none may ship inside the app.
  provider: github
  owner: autonomx
  repo: MarketPulse
  releaseType: release
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
