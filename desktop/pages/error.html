<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'" />
    <title>MarketPulse</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body class="shell error">
    <main>
      <img src="../icons/icon-64.png" alt="" width="48" height="48" />
      <h1>MarketPulse could not start</h1>
      <p id="message" role="alert"></p>
      <pre id="log" aria-label="Last log lines"></pre>
      <div class="actions">
        <button type="button" id="retry">Retry</button>
        <button type="button" id="new-port" hidden>Choose new ports</button>
        <button type="button" id="logs">Open logs folder</button>
        <button type="button" id="quit">Quit</button>
      </div>
    </main>
    <script src="shell-page.js"></script>
  </body>
</html>
