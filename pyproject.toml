# MarketPulse's pyproject.toml is generated by sync/sync_from_omnix.py: this head is MarketPulse's own, and the
# tool tables below it are Omnix's at the mirrored commit. Edit sync/templates/pyproject.head.toml, not this file.

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "MarketPulse: the Omnix trading app as a self-contained desktop program"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "marketpulse*"]

# Below: tables copied from Omnix's pyproject.toml by sync/sync_from_omnix.py; do not edit here.

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9", "W6", "B006", "B008", "B017", "PLE", "UP006", "UP007"]

[tool.ruff.lint.per-file-ignores]
"src/app/platform/assistant_memory/controls.py" = ["I001"]
"src/app/platform/assistant_memory/initiative.py" = ["BLE001"]
"src/app/platform/assistant_memory/jobs.py" = ["UP012"]
"src/app/platform/assistant_memory/observability.py" = ["UP037"]
"src/app/platform/assistant_memory/paralinguistic_state.py" = ["FURB167", "UP037", "FLY002"]
"src/app/platform/assistant_memory/structured_extraction.py" = ["FURB167", "BLE001"]
"src/app/platform/assistant_memory/structured_provider.py" = ["BLE001"]
"src/app/platform/assistant_memory/temporal_retrieval.py" = ["I001", "DTZ007"]
"src/app/platform/chat/character_store.py" = ["I001"]
"src/app/platform/chat/compaction.py" = ["I001", "UP012", "UP037"]
"src/app/platform/chat/provider_metrics.py" = ["PLR0124"]
"src/app/composition/gateway/blocking_route_offload.py" = ["UP035"]
"src/app/composition/gateway/event_loop_lag_monitor.py" = ["UP035"]
"src/app/providers/lmstudio_provider.py" = ["BLE001", "RUF012", "UP006", "UP007", "UP035", "UP045"]
"src/app/providers/stt_live_runtime_support.py" = ["BLE001"]
"src/app/providers/stt_live_websocket.py" = ["BLE001", "S110", "UP037"]
"src/app/providers/stt_segment_scheduler.py" = ["BLE001", "UP035"]
"src/tests/app/test_chat_response_metrics.py" = ["I001"]
"src/tests/app/test_gateway_event_loop_lag_monitor.py" = ["ASYNC251"]
"src/tests/app/test_live_chat_authoritative_state_source.py" = ["FLY002"]
"src/tests/chat/test_live_chat_postgres_fast_path.py" = ["I001"]
"src/tests/app/test_live_full_duplex_acceptance.py" = ["RUF012"]
"src/tests/app/test_live_material_context.py" = ["I001"]
"src/tests/live_voice/test_live_voice_runtime_offload.py" = ["PIE807"]
"src/tests/app/test_tts_stream_contract_performance.py" = ["RUF012"]
"src/tests/unit/assistant_memory/test_companion_completion_acceptance.py" = ["I001"]
"src/tests/unit/assistant_memory/test_companion_controls.py" = ["I001"]
"src/tests/unit/assistant_memory/test_companion_phase8_evaluation.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "-q --tb=short --strict-markers --import-mode=importlib"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "postgres: requires disposable PostgreSQL",
  "multiprocess: requires multiple processes",
  "gpu: requires a GPU/model runtime",
  "live_provider: calls a live external/provider service",
  "playwright: browser automation test",
  "slow: long-running deterministic test",
  "smoke: quick smoke test",
  "api: API contract test",
  "frontend: frontend-oriented Python test",
  "js_analysis: static JavaScript analysis",
  "e2e: end-to-end test",
  "functional: functional test",
  "live_codex: opt-in real ChatGPT-authenticated Codex test",
]

[tool.mypy]
files = ["src/app"]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true

# Our own modules must resolve: a mistyped internal import is an error, not Any.

[[tool.mypy.overrides]]
module = ["app.*"]
ignore_missing_imports = false

# Packages not yet type-checked; remove a package once mypy passes on it.

[[tool.mypy.overrides]]
module = [
  "app.platform.assistant_tools", "app.platform.assistant_tools.*",
  "app.apps.audiobook", "app.apps.audiobook.*",
  "app.platform.characters", "app.platform.characters.*",
  "app.apps.desktop_companion", "app.apps.desktop_companion.*",
  "app.platform.live_voice", "app.platform.live_voice.*",
  "app.providers", "app.providers.*",
  "app.platform.research", "app.platform.research.*",
  "app.settings", "app.settings.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "app.runtime.config",
  "app.runtime.capabilities",
  "app.runtime.contracts",
  "app.runtime.paths",
  "app.runtime.net",
  "app.persistence.contracts",
  "app.persistence.module_repositories",
  "app.persistence.repository_registry",
  "app.persistence.shared_repository_specs",
  "app.persistence.transaction_binding",
  "app.persistence.transaction_policy",
  "app.persistence.unit_of_work",
  "app.config", "app.config.*",
  "app.jobs", "app.jobs.*",
  "app.capabilities", "app.capabilities.*",
  "app.conversation", "app.conversation.*",
  "app.observability", "app.observability.*",
  "app.security", "app.security.*",
]
ignore_errors = false
disallow_untyped_defs = true
no_implicit_optional = true

# PA-3.1: each platform capability's contract is strict-typed, though the
# module behind it is not yet (exact names win over the wildcards above).

[[tool.mypy.overrides]]
module = [
  "app.platform.agent_runtime.contracts",
  "app.platform.assistant_tools.contracts",
  "app.platform.characters.contracts",
  "app.platform.chat.contracts",
  "app.platform.companion_activity.contracts",
  "app.platform.image.contracts",
  "app.platform.live_voice.contracts",
  "app.platform.research.contracts",
]
ignore_errors = false
disallow_untyped_defs = true
no_implicit_optional = true
