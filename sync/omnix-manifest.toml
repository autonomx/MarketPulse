# What MarketPulse mirrors from Omnix (roadmap §4.1-4.2).
#
# Mirrored paths are byte-identical to Omnix at the commit in omnix-sync.json and are never edited here:
# a change to them is made in Omnix and synced. `python sync/sync_from_omnix.py check` fails on any drift.

[source]
# A local Omnix checkout; the tool reads the commit's tree from its git objects, not the working tree.
checkout = "F:/LLM/omnix"
ref = "main"

[mirror]
include = [
  # The whole backend: the composition root, the schema and the test fixtures need the full tree (§3).
  "src/app/**",
  # Gateway launcher and its local job worker.
  "scripts/run_omnix_gateway.py",
  "scripts/gateway_cluster.py",
  "scripts/export_gateway_openapi.py",
  # Trading research tooling some trading tests import.
  "scripts/trade/**",
  "scripts/run_trading_strategy_*.py",
  # Locked Python dependencies.
  "requirements/*.in",
  "requirements/*.lock.txt",
  "requirements/README.md",
  # Tests: the root conftest machinery, support helpers and the trading, auth and seam tests.
  "src/tests/__init__.py",
  "src/tests/README.md",
  "src/tests/conftest.py",
  "src/tests/conftest_databases.py",
  "src/tests/conftest_quarantine.py",
  "src/tests/quarantine.toml",
  "src/tests/import_isolation.py",
  "src/tests/support/**",
  "src/tests/pages/**",
  "src/tests/utils/**",
  "src/tests/fixtures/**",
  "src/tests/trading/**",
  "src/tests/persistence/test_trading*.py",
  "src/tests/persistence/test_auth*.py",
  "src/tests/persistence/test_provider_secret_store_unit.py",
  "src/tests/security/test_auth*.py",
  "src/tests/security/test_request_guard*.py",
  "src/tests/app/test_writable_resources_root.py",
  # Trading test fixtures (read-only, bundled); not the research inbox or state.
  "resources/trading/indicator_goldens/**",
  "resources/trading/script_corpus/**",
  "resources/trading/drawing_alert_levels/**",
  # The whole web source; the MarketPulse entry under web/marketpulse registers only trading.
  "web/src/**",
  "web/public/**",
  "web/index.html",
  "web/vite.config.ts",
  "web/vitest.config.ts",
  "web/tsconfig.json",
  "web/tsconfig.*.json",
  "web/eslint.config.js",
  "web/scripts/generate-api-types.mjs",
  "web/tests/e2e/trading-terminal.spec.ts",
  "web/tests/e2e/support/**",
  # Licences of what Omnix includes.
  "THIRD_PARTY_NOTICES.md",
]
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  "**/.pytest_cache/**",
]

[derived]
# Generated by the sync tool from Omnix files at the same commit; `check` regenerates and compares them.
pyproject = { from = "pyproject.toml", head = "sync/templates/pyproject.head.toml", tables = ["tool.ruff", "tool.pytest", "tool.mypy", "tool.coverage"] }
web_package = { from = "web/package.json", lock = "package-lock.json", root = "package.json", template = "sync/templates/web-package.json" }
