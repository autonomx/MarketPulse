# What MarketPulse mirrors from Omnix (roadmap §4.1-4.2).
#
# Mirrored paths are byte-identical to Omnix at the commit in omnix-sync.json and are never edited here:
# a change to them is made in Omnix and synced. `python sync/sync_from_omnix.py check` fails on any drift.

[source]
# A local Omnix checkout; the tool reads the commit's tree from its git objects, not the working tree.
checkout = "F:/LLM/omnix"
ref = "main"

[mirror]
include = [
  # The whole backend: the composition root, the schema and the test fixtures need the full tree (§3).
  "src/app/**",
  # Gateway launcher and its local job worker.
  "scripts/run_omnix_gateway.py",
  "scripts/gateway_cluster.py",
  "scripts/export_gateway_openapi.py",
  # Trading research tooling some trading tests import.
  "scripts/trade/**",
  "scripts/run_trading_strategy_*.py",
  # Locked Python dependencies.
  "requirements/*.in",
  "requirements/*.lock.txt",
  "requirements/README.md",
  # Tests: the root conftest machinery, support helpers and the trading, auth and seam tests.
  "src/tests/__init__.py",
  "src/tests/README.md",
  "src/tests/conftest.py",
  "src/tests/conftest_databases.py",
  "src/tests/conftest_quarantine.py",
  "src/tests/quarantine.toml",
  "src/tests/import_isolation.py",
  "src/tests/support/**",
  "src/tests/pages/**",
  "src/tests/utils/**",
  "src/tests/fixtures/**",
  "src/tests/trading/**",
  "src/tests/persistence/conftest.py",
  "src/tests/persistence/test_trading*.py",
  "src/tests/persistence/test_auth*.py",
  "src/tests/persistence/test_provider_secret_store_unit.py",
  "src/tests/security/test_auth*.py",
  "src/tests/app/test_writable_resources_root.py",
  # Trading test fixtures (read-only, bundled); not the research inbox or state.
  "resources/trading/indicator_goldens/**",
  "resources/trading/script_corpus/**",
  "resources/trading/drawing_alert_levels/**",
  # The whole web source; the MarketPulse entry under web/marketpulse registers only trading.
  "web/src/**",
  "web/public/**",
  "web/index.html",
  "web/*.ts",
  "web/*.js",
  "web/tsconfig.json",
  "web/tsconfig.*.json",
  "web/eslint.config.js",
  "web/scripts/generate-api-types.mjs",
  "web/tests/e2e/trading-terminal.spec.ts",
  "web/tests/e2e/trading-look.spec.ts",
  "web/tests/e2e/support/**",
  # Trading architecture records that trading tests read.
  "docs/architecture/ADR-0004-omnix-trading-terminal.md",
  "docs/architecture/OMNIX_TRADING_*.md",
  # Licences of what Omnix includes.
  "THIRD_PARTY_NOTICES.md",
]
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  "**/.pytest_cache/**",
  # Phase 12: other features' code. A trading-only gateway never imports it (Omnix keeps it behind feature checks);
  # each package's schema and declarations stay, through `keep`, because the full schema ships. Platform research
  # (trading's catalyst research uses it), characters and image (the test conftest wires them) stay whole.
  "src/app/apps/rpg/**",
  "src/app/apps/story/**",
  "src/app/apps/audiobook/**",
  "src/app/apps/desktop_companion/**",
  "src/app/apps/character_interactions/**",
  "src/app/platform/live_speech/**",
  "src/app/platform/companion_activity/**",
  "src/app/providers/vendor/**",
]
# Mirrored although excluded above: what the schema runner and the settings declarations read from every feature.
keep = [
  "src/app/apps/rpg/__init__.py",
  "src/app/apps/rpg/feature.py",
  "src/app/apps/rpg/declarations.py",
  "src/app/apps/rpg/**/migrations/**",
  "src/app/apps/story/__init__.py",
  "src/app/apps/story/feature.py",
  "src/app/apps/story/declarations.py",
  "src/app/apps/story/**/migrations/**",
  "src/app/apps/audiobook/__init__.py",
  "src/app/apps/audiobook/feature.py",
  "src/app/apps/audiobook/declarations.py",
  "src/app/apps/audiobook/**/migrations/**",
  "src/app/apps/desktop_companion/__init__.py",
  "src/app/apps/desktop_companion/feature.py",
  "src/app/apps/desktop_companion/declarations.py",
  "src/app/apps/desktop_companion/**/migrations/**",
  "src/app/apps/character_interactions/__init__.py",
  "src/app/apps/character_interactions/feature.py",
  "src/app/apps/character_interactions/declarations.py",
  "src/app/apps/character_interactions/**/migrations/**",
  "src/app/platform/live_speech/__init__.py",
  "src/app/platform/live_speech/feature.py",
  "src/app/platform/live_speech/declarations.py",
  "src/app/platform/live_speech/**/migrations/**",
  "src/app/platform/companion_activity/__init__.py",
  "src/app/platform/companion_activity/feature.py",
  "src/app/platform/companion_activity/declarations.py",
  "src/app/platform/companion_activity/**/migrations/**",
  "src/app/providers/vendor/__init__.py",
  "src/app/providers/vendor/feature.py",
  "src/app/providers/vendor/declarations.py",
  "src/app/providers/vendor/**/migrations/**",
]

[derived]
# Generated by the sync tool from Omnix files at the same commit; `check` regenerates and compares them.
pyproject = { from = "pyproject.toml", head = "sync/templates/pyproject.head.toml", tables = ["tool.ruff", "tool.pytest", "tool.mypy", "tool.coverage"] }
web_package = { from = "web/package.json", lock = "package-lock.json", root = "package.json", template = "sync/templates/web-package.json" }
