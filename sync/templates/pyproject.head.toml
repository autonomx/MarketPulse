# MarketPulse's pyproject.toml is generated by sync/sync_from_omnix.py: this head is MarketPulse's own, and the
# tool tables below it are Omnix's at the mirrored commit. Edit sync/templates/pyproject.head.toml, not this file.

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse"
version = "0.1.0"
requires-python = "{{requires_python}}"
description = "MarketPulse: the Omnix trading app as a self-contained desktop program"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "marketpulse*"]
